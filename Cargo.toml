[workspace]
members = ["crates/signout-core", "crates/chrome-platform", "src-tauri"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "1.0.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
