[package]
name = "chrome-platform"
version.workspace = true
edition.workspace = true

[dependencies]
signout-core = { path = "../signout-core" }
serde.workspace = true
serde_json.workspace = true
fs2 = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSBundle", "NSURL", "NSString", "NSArray"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }

[target.'cfg(windows)'.dependencies]
wmi = "0.18"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Registry", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_System_StationsAndDesktops"] }

[dev-dependencies]
tempfile.workspace = true
rusqlite.workspace = true
